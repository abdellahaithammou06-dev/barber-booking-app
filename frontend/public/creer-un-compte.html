<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Créer un compte — Barber Booking</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/theme.css"><script defer src="/auth.js"></script>
</head>
<body class="auth-page">
  <header><a href="/" class="brand">Barber Booking</a><a class="back-home" href="/">← Retour à l'accueil</a><a class="back-home" href="/contact.html">Contact</a></header>
  <main class="auth-main"><section class="auth-card"><p class="eyebrow">BIENVENUE</p><h1>Créer un compte</h1><p>Inscrivez-vous pour réserver votre prochain rendez-vous.</p><form id="register-form"><label>Nom<input name="name" autocomplete="name" required></label><label>E-mail<input name="email" type="email" autocomplete="email" required></label><label>Mot de passe<input name="password" type="password" minlength="8" autocomplete="new-password" placeholder="8 caractères minimum" required></label><label>Je suis<select name="role"><option value="client">Client</option><option value="barber">Barbier</option></select></label><button>Créer mon compte</button><p id="auth-message" class="form-message" aria-live="polite"></p></form><div class="auth-divider"><span>ou continuer avec</span></div><div id="google-signin" class="google-signin"></div><p class="google-hint">La connexion Google crée un compte client.</p><p class="auth-switch">Vous avez déjà un compte ? <a href="/connexion.html">Se connecter</a></p></section></main>
</body>
</html>
