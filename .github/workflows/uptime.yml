name: Surveillance du site

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-production:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier que le site répond
        env:
          APP_URL: https://barber-booking-app-production.up.railway.app
        run: |
          curl --fail --silent --show-error --max-time 20 "$APP_URL/api/ready"
          printf '\n'
      - name: Vérifier le service de rappels
        env:
          APP_URL: https://barber-booking-app-production.up.railway.app
        run: |
          curl --fail --silent --show-error --max-time 20 "$APP_URL/api/health/reminders"
          printf '\n'
